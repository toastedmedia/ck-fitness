<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CK Fitness</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #1b1b36; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
      b { color: #c8a84b; font-size: 40px; letter-spacing: -2px; }
      h1 { font-size: 20px; margin: 12px 0 6px; }
      p { margin: 0 0 20px; color: #d6d8e6; font-size: 15px; line-height: 1.5; max-width: 320px; }
      button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: #c8a84b; color: #1b1b36; font-weight: 700; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <b>CK</b>
      <h1>You appear to be offline</h1>
      <p>CK Fitness needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.href='/'">Try again</button>
    </main>
  </body>
</html>
