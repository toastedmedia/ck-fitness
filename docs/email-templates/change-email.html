<!-- Supabase template: Change email address. Subject: Confirm your new email address -->
<div
  style="
    background: #f3f4f9;
    padding: 24px 12px;
    font-family: Arial, Helvetica, sans-serif;
  "
>
  <table
    role="presentation"
    width="100%"
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
    "
  >
    <tr>
      <td style="background: #1b1b36; padding: 20px 24px">
        <div
          style="
            color: #c8a84b;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
          "
        >
          Chardikala Fitness &amp; Performance
        </div>
        <div style="color: #ffffff; font-size: 22px; font-weight: bold; margin-top: 4px">
          CK Fitness
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding: 24px; color: #1b1b36; font-size: 15px; line-height: 1.55">
        <h1 style="margin: 0 0 8px; font-size: 20px">Confirm your new email</h1>
        <p style="margin: 0 0 16px">
          Tap the button to confirm this as your new email address for CK Fitness.
        </p>
        <p style="margin: 0 0 20px">
          <a
            href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/profile"
            style="
              display: inline-block;
              background: #c8a84b;
              color: #1b1b36;
              text-decoration: none;
              font-weight: bold;
              padding: 14px 26px;
              border-radius: 999px;
            "
            >Confirm new email</a
          >
        </p>
        <p style="margin: 0; color: #5b6075; font-size: 13px">
          If you did not request this change, please contact support.
        </p>
      </td>
    </tr>
    <tr>
      <td
        style="
          padding: 14px 24px;
          border-top: 1px solid #dfe2ec;
          color: #5b6075;
          font-size: 12px;
        "
      >
        Need help? Reply to this email or visit app.chardikalafitness.com/support
      </td>
    </tr>
  </table>
</div>
