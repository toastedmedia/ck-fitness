<style>
  /* Layout: the real refined Home, shown as four phone-width screenshots side by side (they wrap on small screens). */
  :root { --bg:#eceef5; --fg:#1b1b36; --muted:#5b6075; --gold:#8a6d1a; --font:"Plus Jakarta Sans",system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1020; --fg:#eceefa; --muted:#a2a8c4; --gold:#d9bb62; color-scheme: dark; } }

  .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; }

  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px; align-items:start; }
  figure { margin:0; display:flex; flex-direction:column; gap:10px; align-items:center; min-width:0; }
  .phone { width:100%; max-width:300px; background:#0a0a18; border-radius:38px; padding:8px; box-shadow:0 20px 50px rgba(10,10,40,.25); }
  .phone img { display:block; width:100%; height:auto; border-radius:30px; }
  figcaption { text-align:center; font-size:13px; color:var(--muted); max-width:30ch; } figcaption b { display:block; color:var(--fg); font-size:14px; }
