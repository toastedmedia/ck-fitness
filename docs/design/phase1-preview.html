<title>CK Fitness Phase 1 Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=DM+Sans:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Outfit:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<style>
  /* Layout: a presentation page. Left rail picks a screen, centre shows it in a phone (member app) or a browser window (admin). */
  :root {
    --bg: #eef0ec;
    --surface: #ffffff;
    --fg: #1c2420;
    --muted: #55615a;
    --line: #d8ddd5;
    --accent: #0f3d2e;
    --accent-fg: #fbf8f1;
    --gold: #a8801f;
    --f-display: "Fraunces", Georgia, serif;
    --f-body: "Inter", system-ui, sans-serif;

    /* The app being depicted keeps its own brand palette in both themes. */
    --app-green-900: #0f3d2e;
    --app-green-800: #14513c;
    --app-green-700: #1b6b4e;
    --app-green-100: #e3efe9;
    --app-cream-50: #fbf8f1;
    --app-cream-100: #f4efe3;
    --app-cream-200: #e8e0cd;
    --app-gold-600: #a8801f;
    --app-gold-500: #c9a13b;
    --app-gold-100: #f6ecd0;
    --app-ink: #1c2420;
    --app-ink-2: #4a5650;
    --app-danger: #a33a2f;
    --app-white: #ffffff;
    --app-ondark: #cfdcd3;
    --app-on-primary: #ffffff;
    --app-on-gold: #2a2208;
    --app-o700: #7a5c12;
    --app-gold-border: #e6d49c;
    --app-danger-border: #e3b8b2;
    --app-deep: #0b2a20;
    --app-side-accent: #c9a13b;
    --app-display: "Fraunces", Georgia, serif;
    --app-r-card: 18px;
    --app-r-btn: 14px;
    --cv1: linear-gradient(135deg, #1b6b4e, #0f3d2e);
    --cv2: linear-gradient(135deg, #a8801f, #6d4f0e);
    --cv3: linear-gradient(135deg, #14513c, #2f7a5c);
    --cv4: linear-gradient(135deg, #5a4a2a, #2c2412);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101613;
      --surface: #19211d;
      --fg: #e9eee9;
      --muted: #9aa8a0;
      --line: #2b3630;
      --accent: #c9a13b;
      --accent-fg: #101613;
      --gold: #c9a13b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101613;
    --surface: #19211d;
    --fg: #e9eee9;
    --muted: #9aa8a0;
    --line: #2b3630;
    --accent: #c9a13b;
    --accent-fg: #101613;
    --gold: #c9a13b;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 56px;
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 3px solid var(--app-gold-500);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 1120px;
    margin-inline: auto;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  h1.title {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.1;
    margin: 6px 0 8px;
    text-wrap: balance;
  }
  .lede {
    color: var(--muted);
    max-width: 62ch;
    margin: 0;
  }

  .styles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 22px;
  }
  .sopt {
    text-align: left;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 44px;
  }
  .sopt[aria-pressed="true"] {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  .sopt b {
    font-size: 14px;
  }
  .sopt span.d {
    font-size: 12.5px;
    color: var(--muted);
  }
  .sw {
    display: flex;
    gap: 4px;
  }
  .sw i {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: block;
  }
  .modes {
    display: flex;
    gap: 8px;
    margin-block: 24px 20px;
    flex-wrap: wrap;
  }
  .mode {
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    min-height: 44px;
  }
  .mode[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }

  .stage {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .rail {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 16px;
  }
  .rail-group {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 4px;
    font-weight: 600;
  }
  .rail-btn {
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--fg);
    padding: 10px 12px;
    border-radius: 10px;
    min-height: 40px;
    font-weight: 500;
  }
  .rail-btn:hover {
    background: var(--surface);
  }
  .rail-btn[aria-current="true"] {
    background: var(--surface);
    box-shadow: inset 3px 0 0 var(--gold);
    font-weight: 600;
  }
  .canvas {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .note {
    max-width: 62ch;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin: 0;
  }
  .note strong {
    color: var(--fg);
  }

  @media (max-width: 760px) {
    .stage {
      grid-template-columns: minmax(0, 1fr);
    }
    .rail {
      flex-direction: row;
      flex-wrap: wrap;
      position: static;
      gap: 6px;
    }
    .rail-group {
      display: none;
    }
    .rail-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 8px 12px;
    }
    .rail-btn[aria-current="true"] {
      box-shadow: none;
      border-color: var(--gold);
    }
  }

  /* ---------------- Phone ---------------- */
  .phone {
    width: min(100%, 372px);
    background: #0b1410;
    border-radius: 44px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
  }
  .screen {
    background: var(--app-cream-50);
    color: var(--app-ink);
    border-radius: 34px;
    height: 740px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 10.4px;
    position: relative;
  }
  .status {
    height: 34px;
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-inline: 26px;
    font-size: 9.6px;
    font-weight: 600;
    color: var(--app-ink);
  }
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 20px;
  }
  .scroll.dark {
    background: var(--app-green-900);
    color: var(--app-cream-50);
  }
  .screen,
  .browser {
    font-family: var(--app-body, var(--f-body));
  }
  .app h1,
  .app h2,
  .app h3 {
    letter-spacing: var(--app-hls, 0);
    font-weight: var(--app-hw, 600);
    font-family: var(--app-display);
    font-weight: 600;
    margin: 0;
    color: var(--app-green-900);
    line-height: 1.15;
  }
  .app h1 {
    font-size: 19.2px;
  }
  .app h2 {
    font-size: 14.4px;
  }
  .app h3 {
    font-size: 12px;
  }
  .app p {
    margin: 0;
  }
  .muted {
    color: var(--app-ink-2);
  }
  .tiny {
    font-size: 8.8px;
  }
  .label {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--app-gold-600);
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stack-sm {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .between {
    justify-content: space-between;
  }
  .grow {
    flex: 1;
    min-width: 0;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    border-radius: var(--app-r-btn);
    border: 2px solid var(--app-green-900);
    background: var(--app-green-900);
    color: var(--app-cream-50);
    font-weight: 600;
    width: 100%;
    padding-inline: 16px;
  }
  .btn.ghost {
    background: transparent;
    color: var(--app-green-900);
  }
  .btn.gold {
    background: var(--app-gold-500);
    border-color: var(--app-gold-500);
    color: var(--app-on-gold);
  }
  .btn.small {
    min-height: 40px;
    width: auto;
    font-size: 9.6px;
    border-radius: 12px;
    padding-inline: 14px;
  }
  .card {
    background: var(--app-white);
    border: 1px solid var(--app-cream-200);
    border-radius: var(--app-r-card);
    padding: 14px;
  }
  .card.green {
    background: var(--app-green-900);
    color: var(--app-cream-50);
    border-color: var(--app-green-900);
  }
  .card.green h2,
  .card.green h3 {
    color: var(--app-cream-50);
  }
  .card.gold {
    background: var(--app-gold-100);
    border-color: var(--app-gold-border);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 8.4px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--app-green-100);
    color: var(--app-green-800);
  }
  .pill.gold {
    background: var(--app-gold-100);
    color: var(--app-o700);
  }
  .pill.lock {
    background: var(--app-cream-100);
    color: var(--app-ink-2);
  }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .chip {
    flex: none;
    border: 1.5px solid var(--app-cream-200);
    background: var(--app-white);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 9.6px;
    font-weight: 500;
    min-height: 40px;
    color: var(--app-ink);
  }
  .chip.on {
    background: var(--app-green-900);
    color: var(--app-cream-50);
    border-color: var(--app-green-900);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field span {
    font-size: 9.6px;
    font-weight: 600;
  }
  .input {
    min-height: 48px;
    border: 1.5px solid var(--app-cream-200);
    background: var(--app-white);
    border-radius: 12px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    color: var(--app-ink-2);
  }
  .ico {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }
  .tabbar {
    flex: none;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--app-cream-200);
    background: var(--app-white);
    padding: 6px 4px 14px;
  }
  .tab {
    border: 0;
    background: transparent;
    color: var(--app-ink-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 8px;
    min-height: 52px;
    justify-content: center;
    border-radius: 12px;
  }
  .tab[aria-current="true"] {
    color: var(--app-green-900);
    font-weight: 600;
  }
  .tab[aria-current="true"] .ico {
    stroke: var(--app-green-900);
    stroke-width: 2.2;
  }
  .back {
    border: 0;
    background: transparent;
    color: var(--app-green-900);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 40px;
    padding: 0;
  }

  .cover {
    border-radius: 14px;
    height: 120px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 10px;
    color: var(--app-cream-50);
  }
  .cover.c1 {
    background: var(--cv1);
  }
  .cover.c2 {
    background: var(--cv2);
  }
  .cover.c3 {
    background: var(--cv3);
  }
  .cover.c4 {
    background: var(--cv4);
  }
  .cover svg {
    position: absolute;
    right: -14px;
    top: -10px;
    width: 110px;
    opacity: 0.18;
  }
  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--app-cream-200);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    background: var(--app-green-700);
    border-radius: 99px;
  }
  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }
  .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 8px;
    color: var(--app-ink-2);
  }
  .dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--app-cream-200);
    display: grid;
    place-items: center;
    background: var(--app-white);
  }
  .dot.done {
    background: var(--app-green-700);
    border-color: var(--app-green-700);
    color: var(--app-on-primary);
  }
  .dot.plan {
    border-color: var(--app-gold-500);
  }
  .dot.rest {
    background: var(--app-cream-100);
  }
  .dot.missed {
    border-style: dashed;
    border-color: var(--app-ink-2);
  }
  .video {
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--app-green-800), var(--app-deep));
    display: grid;
    place-items: center;
    color: #fff;
    position: relative;
    max-width: 100%;
  }
  .video .play {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(251, 248, 241, 0.92);
    display: grid;
    place-items: center;
    color: var(--app-green-900);
  }
  .video .scrub {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 10px;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 9px;
  }
  .video .scrub i {
    display: block;
    height: 100%;
    width: 38%;
    background: var(--app-gold-500);
    border-radius: 9px;
  }
  .seg {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .seg i {
    font-style: normal;
    text-align: center;
    border: 1.5px solid var(--app-cream-200);
    background: var(--app-white);
    border-radius: 10px;
    min-height: 42px;
    display: grid;
    place-items: center;
    font-weight: 600;
  }
  .seg i.on {
    background: var(--app-green-900);
    color: var(--app-on-primary);
    border-color: var(--app-green-900);
  }
  .step {
    display: flex;
    gap: 4px;
  }
  .step i {
    flex: 1;
    height: 5px;
    border-radius: 9px;
    background: var(--app-cream-200);
  }
  .step i.on {
    background: var(--app-gold-500);
  }
  .center {
    text-align: center;
  }
  svg text {
    font-family: var(--f-body);
  }

  /* ---------------- Admin browser ---------------- */
  .browser {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
  }
  .chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .chrome i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
  }
  .chrome .url {
    margin-left: 10px;
    font-size: 10.8px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 10px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .admin {
    display: grid;
    grid-template-columns: 168px minmax(0, 1fr);
    min-height: 560px;
  }
  .a-side {
    background: var(--app-green-900);
    color: var(--app-ondark);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .a-side .brand {
    font-family: var(--app-display);
    font-size: 15.3px;
    padding: 4px 10px 14px;
    color: var(--app-cream-50);
  }
  .a-side .brand small {
    display: block;
    font-family: var(--f-body);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--app-side-accent);
  }
  .a-nav {
    background: transparent;
    border: 0;
    color: var(--app-ondark);
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 12.2px;
    min-height: 38px;
  }
  .a-nav[aria-current="true"] {
    background: rgba(128, 128, 128, 0.22);
    color: var(--app-cream-50);
    font-weight: 600;
  }
  .a-nav.off {
    opacity: 0.45;
    cursor: default;
  }
  .a-main {
    padding: 20px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .a-main h2 {
    font-family: var(--app-display);
    font-size: 19.8px;
    margin: 0;
    font-weight: 600;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .tile {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  .tile b {
    display: block;
    font-size: 21.6px;
    font-family: var(--app-display);
    font-variant-numeric: tabular-nums;
  }
  .tile span {
    font-size: 11.2px;
    color: var(--muted);
  }
  .a-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    min-width: 0;
  }
  .a-card h3 {
    margin: 0 0 8px;
    font-size: 12.6px;
  }
  .twocol {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 12px;
  }
  .scrollx {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 10.8px;
    min-width: 460px;
  }
  th {
    text-align: left;
    font-size: 9.9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .st {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 10.3px;
    font-weight: 600;
  }
  .st.ok {
    background: #dcefe4;
    color: #14513c;
  }
  .st.warn {
    background: #f6ecd0;
    color: #7a5c12;
  }
  .st.bad {
    background: #f3d9d5;
    color: #8a2d23;
  }
  .st.mute {
    background: var(--bg);
    color: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .st.ok {
      background: #1d3b2d;

    const groups = mode === "app" ? APP_GROUPS : [["Pages", Object.keys(ADMIN)]];

      .map(

    if (!go) return;
    const id = go.dataset.go;
    const set = mode === "app" ? APP : ADMIN;
    if (set[id]) {
      current[mode] = id;
      render();
    }
  });
  document.getElementById("mode-app").addEventListener("click", () => {
    mode = "app";
    render();
  });
  document.getElementById("mode-admin").addEventListener("click", () => {
    mode = "admin";
    render();
  });
  render();
</script>
