name: Live smoke test

# Opens the real, deployed app in a browser and checks the basics. Runs every morning and on demand.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        default: "https://app.chardikalafitness.com"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://app.chardikalafitness.com' }}
          # Optional: add these two repository secrets to also test a real login.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
