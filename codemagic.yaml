# Cloud builds for the CK Fitness store apps (Codemagic, because no Mac is needed).
# One-time setup is in docs/APP_STORES.md. Replace the groups/integration names with the ones you create.
workflows:
  android-release:
    name: Android (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      node: 20
      java: 17
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      android_signing:
        - ck_keystore # upload keystore saved in Codemagic -> Code signing identities
      vars:
        PACKAGE_NAME: com.chardikalafitness.app
    scripts:
      - name: Install
        script: npm ci --no-audit --no-fund
      - name: Sync Capacitor
        script: cd apps/mobile && npx cap sync android
      - name: Set version code
        script: |
          cd apps/mobile/android
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      - name: Build signed bundle
        script: |
          cd apps/mobile/android
          ./gradlew bundleRelease
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iPhone (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ck_app_store_connect
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chardikalafitness.app
      vars:
        BUNDLE_ID: com.chardikalafitness.app
    scripts:
      - name: Install
        script: npm ci --no-audit --no-fund
      - name: Create the iOS project
        script: |
          cd apps/mobile
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#1b1b36' --splashBackgroundColor '#1b1b36'
          npx cap sync ios
      - name: Patch iPhone settings
        script: bash apps/mobile/scripts/patch-ios.sh
      - name: Apply signing
        script: xcode-project use-profiles --project apps/mobile/ios/App/App.xcodeproj
      - name: Build number
        script: |
          cd apps/mobile/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project apps/mobile/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
